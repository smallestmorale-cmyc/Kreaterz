<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KREATERZ | AI Creative Hub</title>
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        nav {
            position: fixed;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 100;
            padding: 0 15px;
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            transform: scale(1.1);
        }

        .container.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .btn-box {
            background: var(--glass);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-box:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .active-nav {
            border-color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.1);
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtext {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.5;
            margin-bottom: 30px;
        }

        form {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: white;
            outline: none;
        }

        input:focus { border-color: var(--neon-blue); }

        .lab-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        @media (max-width: 600px) {
            .lab-grid { grid-template-columns: 1fr; }
            nav { top: 10px; flex-wrap: wrap; }
            .btn-box { font-size: 0.6rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <nav id="main-nav">
        <div class="btn-box active-nav" onclick="navTo('home')">Home</div>
        <div class="btn-box" onclick="navTo('lab')">Lab</div>
        <div class="btn-box" onclick="navTo('logs')">Logs</div>
        <div class="btn-box" onclick="navTo('join')">Join</div>
    </nav>

    <div id="home" class="container active">
        <h1>KREATERZ</h1>
        <p class="subtext">Creative Intelligence</p>
        <div class="btn-box" onclick="navTo('lab')" style="padding: 18px 40px;">Initialize</div>
    </div>

    <div id="lab" class="container">
        <h1>THE LAB</h1>
        <p class="subtext">Neural Experiments</p>
        <div class="lab-grid">
            <div class="btn-box" style="height: 100px; display: flex; align-items: center; justify-content: center;">Vision AI</div>
            <div class="btn-box" style="height: 100px; display: flex; align-items: center; justify-content: center;">Synthesis</div>
        </div>
    </div>

    <div id="logs" class="container">
        <h1>DEV LOG</h1>
        <div class="btn-box" style="text-align: left; max-width: 350px;">
            <p style="color: var(--neon-blue); font-size: 0.6rem; font-weight: bold;">SYSTEM_UPDATE_V1.0</p>
            <p style="margin-top: 10px; opacity: 0.8; text-transform: none;">Particle grid initialized. Global navigation logic optimized for low-latency performance.</p>
        </div>
    </div>

    <div id="join" class="container">
        <h1>WAITLIST</h1>
        <p class="subtext">Request Access</p>
        <form onsubmit="event.preventDefault(); alert('Request Received.');">
            <input type="email" placeholder="email@address.com" required>
            <button type="submit" class="btn-box">Confirm</button>
        </form>
    </div>

    <script>
        // --- 3D PARTICLE BACKGROUND ---
        let scene, camera, renderer, particles;

        function initThree() {
            const container = document.getElementById('bg-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<3000; i++) {
                pos.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            
            const mat = new THREE.PointsMaterial({ color: 0x00f2ff, size: 2, transparent: true, opacity: 0.6 });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);
            camera.position.z = 700;

            function animate() {
                requestAnimationFrame(animate);
                particles.rotation.y += 0.0004;
                particles.rotation.x += 0.0002;
                renderer.render(scene, camera);
            }
            animate();
        }

        // --- NAVIGATION LOGIC ---
        function navTo(pageId) {
            // Update active state of pages
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            // Update nav buttons
            document.querySelectorAll('#main-nav .btn-box').forEach(b => {
                b.classList.remove('active-nav');
                if(b.innerText.toLowerCase() === pageId || (pageId === 'join' && b.innerText === 'JOIN')) {
                    b.classList.add('active-nav');
                }
            });

            // GSAP Entrance
            gsap.from(`#${pageId} h1`, { y: 20, opacity: 0, duration: 0.8 });
        }

        // Start everything on Load
        window.onload = () => {
            initThree();
            navTo('home');
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
